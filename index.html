<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project Maldives</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A7F86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maldives">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* One-column phone app. Lagoon teal on sea-glass neutrals; condensed display type for numbers. */
:root{
  --bg:#EEF3F3; --surface:#FFFFFF; --surface-2:#E3ECEC; --ink:#0E2230; --muted:#56707A; --line:#D3E0E1;
  --accent:#0A7F86; --accent-2:#0B4F62; --accent-ink:#FFFFFF; --accent-soft:#D3EDEC;
  --good:#23824F; --good-soft:#DCF1E4; --warn:#B26B08; --warn-soft:#FBEBD2; --alert:#BE3A31; --alert-soft:#F8DEDB;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",-apple-system,system-ui,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#071419; --surface:#0E222B; --surface-2:#163240; --ink:#E4EFF1; --muted:#8CA5AE; --line:#1D3A46;
  --accent:#36C3C0; --accent-2:#0E5F6E; --accent-ink:#06181C; --accent-soft:#123C42;
  --good:#4CC38A; --good-soft:#123829; --warn:#E8A646; --warn-soft:#3A2B12; --alert:#F0766B; --alert-soft:#41201D; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(88px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
[hidden]{display:none!important}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 0 10px}
.nav{width:48px;height:48px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:24px;flex:none;line-height:1}
.nav:disabled{opacity:.3}
.mid{flex:1;min-width:0;text-align:center}
.mid h1{font-size:25px;line-height:1.05}
.mid .sub{font-size:12px;color:var(--muted)}
.linkbtn{color:var(--accent);font-weight:600;font-size:12px;padding:4px}

.hero{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-radius:20px;padding:18px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.hero h2{font-size:32px;margin:10px 0 6px;line-height:1}
.hero ul{margin:0;padding:0;list-style:none;font-size:14px}
.hero li{padding:2px 0}
.prog{height:8px;border-radius:4px;background:rgba(255,255,255,.22);margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .25s}
.progl{display:flex;justify-content:space-between;font-size:12px;margin-top:5px;opacity:.92}

.flag{margin-top:10px;border-radius:12px;padding:11px 12px;font-size:14px;display:flex;gap:10px;background:var(--surface-2)}
.flag .ic{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--muted)}
.flag.warn{background:var(--warn-soft)}.flag.warn .ic{background:var(--warn)}
.flag.alert{background:var(--alert-soft)}.flag.alert .ic{background:var(--alert)}
.flag.good{background:var(--good-soft)}.flag.good .ic{background:var(--good)}
.flag b{display:block}
.flag .why{font-size:12px;color:var(--muted);margin-top:3px}
.flag .act{margin-top:8px}

.gh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 6px}
.gh h3{font-size:19px}
.gh span{font-size:12px;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.it{border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.ih{display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:64px}
.ck{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.ck svg{width:18px;height:18px;opacity:0}
.it.done .ck{background:var(--accent);border-color:var(--accent)}
.it.done .ck svg{opacity:1}
.it.done .t{color:var(--muted);text-decoration:line-through}
.ib{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;padding:4px 0;min-height:44px;justify-content:center}
.t{font-weight:600}
.s{font-size:13px;color:var(--muted)}
.tm{font-family:var(--display);color:var(--muted);font-size:16px;flex:none;text-align:right;min-width:40px}
.chev{color:var(--muted);font-size:12px;flex:none;transition:transform .2s;width:14px;text-align:center}
.it.open .chev{transform:rotate(90deg)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px;background:var(--surface-2);color:var(--muted)}
.tag.auto{background:var(--accent-soft);color:var(--accent)}
.det{padding:0 14px 16px 64px;font-size:14px}
.det p{margin:6px 0}
.det ul{margin:6px 0;padding-left:18px}
.det .muted{color:var(--muted);font-size:13px}
.ex{padding:10px 0;border-top:1px dashed var(--line)}
.ex:first-of-type{border-top:0}
.exh{display:flex;justify-content:space-between;gap:10px}
.exh b{font-weight:600;min-width:0}
.exh span{font-family:var(--display);font-size:17px;font-weight:600;white-space:nowrap}
.exm{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:2px}
.how{background:var(--accent-soft);color:var(--accent);font-weight:600;padding:4px 10px;border-radius:999px;text-decoration:none}
.plus{color:var(--good);font-weight:600}
.ts{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.ts input{width:76px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:600 16px var(--body);text-align:center}
.supp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0;border-top:1px dashed var(--line)}
.supp:first-child{border-top:0}
.supp span{font-weight:600;text-align:right}
.supp small{grid-column:1/-1;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{font-size:19px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.f label,.lab{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.f input{width:100%;height:50px;border-radius:10px;border:1px solid transparent;background:var(--surface-2);color:var(--ink);font:600 18px var(--body);padding:0 10px}
.f input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.scale{display:flex;gap:4px}
.scale button{flex:1;height:46px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font:600 14px var(--body);min-width:0}
.scale button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{height:50px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:600 15px var(--body)}
.seg button.hit{background:var(--good);border-color:var(--good);color:#fff}
.seg button.miss{background:var(--alert);border-color:var(--alert);color:#fff}
.stack{display:flex;flex-direction:column;gap:12px}
.mt{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:600;line-height:1.05}
.stat span{font-size:12px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
.logic{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.logic li{margin:2px 0}
.logic .y{color:var(--good);font-weight:600}.logic .n{color:var(--muted)}

.md h2{font-size:22px;margin:22px 0 6px}
.md h3{font-size:18px;margin:16px 0 4px}
.md p,.md li{font-size:14px}
.md code{font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.md .tw{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:8px 0}

.banner{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.banner b{display:block}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .w{display:grid;grid-template-columns:repeat(3,1fr);max-width:560px;margin:0 auto}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;min-height:56px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <div id="banner"></div>
  <main id="view"><p class="muted" style="text-align:center;padding:40px 0">Loading your plan…</p></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="w">
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Today</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 6-6"/></svg>Progress</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Plan</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body>
</html>
